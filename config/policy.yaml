# AFTERBELL policy.
#
# Law 6: this file is the only place a limit lives. There is no tool the model
# can call to raise one, and no natural-language path to relaxing one. Changing
# policy means editing this file and restarting. The SHA-256 of this file is
# recorded in every receipt.
#
# Law 1 / Part VIII: EVERY THRESHOLD BELOW IS AN UNCALIBRATED HYPOTHESIS copied
# from the specification. Each is replaced by a measured percentile of recorded
# data before filming, and the calibration table is published in the README.
# A symbol with fewer than min_rth_samples RTH observations is reported
# UNCALIBRATED and receives the most restrictive treatment available.

version: 1
status: UNCALIBRATED          # -> CALIBRATED once Part VIII completes

base_notional_usdt: 5000.0

calibration:
  min_rth_samples: 300        # per symbol, before a baseline is usable
  baseline_window_days: 7
  # Populated by the calibration pass. Empty means: nothing measured yet.
  measured: {}

# P1 - reference-market gap risk. Ramp is calibrated against measured weekend
# realised volatility from our own recorder before it is trusted.
#
# Three ladders combine by min(), never by product:
#   state    - where the reference market is right now
#   backward - how stale the last regular print already is (REFERENCE_AGE)
#   forward  - how much darkness lies ahead before the next regular print
#
# The forward ladder is what separates a Friday evening from a Tuesday evening.
# Both are RTH_POST with a fresh reference, but the first has ~89h of darkness
# ahead and the second ~14h. Sizing on the state label alone would treat the
# more dangerous of the two as the safer.
clock:
  ramp_start_minutes_to_close: 30

  # Keyed on REFERENCE_AGE, seconds. Applies once the print is already stale.
  backward_gap:
    - {max_age_s: 86400,  factor: 1.00}   # <= 24h
    - {max_age_s: 172800, factor: 0.12}   # 24-48h
    - {max_age_s: 259200, factor: 0.06}   # 48-72h
    - {max_age_s: null,   factor: 0.04}   # > 72h

  # Keyed on seconds until the next regular session opens.
  forward_gap:
    - {max_gap_s: 86400,  factor: 1.00}   # ordinary overnight
    - {max_gap_s: 172800, factor: 0.20}   # a weekend ahead
    - {max_gap_s: 259200, factor: 0.12}
    - {max_gap_s: null,   factor: 0.06}   # a long holiday weekend ahead
  # One entry per MarketState, all eight required. The loader refuses to start
  # if any is missing: a state that falls through to a default is a state whose
  # sizing nobody chose. The age-based weekend tiers the spec puts here live in
  # backward_gap below instead, so this table stays keyed on states that
  # actually exist.
  factors:
    RTH_OPEN: 1.00
    RTH_PRE: 0.40
    RTH_POST: 0.40
    CLOSED_OVERNIGHT: 0.25
    CLOSED_WEEKEND: 0.20
    CLOSED_HOLIDAY: 0.12
    HALTED: 0.00
    UNKNOWN: 0.00             # most restrictive, never the loosest (Law 3)
  # Floor the intraday ramp descends to. Tightened further by forward_gap when
  # the coming close leads into a weekend or a holiday.
  ramp_floor: 0.25

# P2 - off-hours liquidity. Ratios are against a rolling median computed over
# RTH_OPEN samples ONLY. These denominators cannot be back-filled.
liquidity:
  depth_band_pct: 1.0
  walk_cost_cap_bps: 100.0    # hard gate, overrides every other factor
  tiers:
    - {max_spread_ratio: 1.5, min_liquidity_ratio: 0.70, factor: 1.00}
    - {max_spread_ratio: 3.0, min_liquidity_ratio: 0.40, factor: 0.50}
    - {max_spread_ratio: 6.0, min_liquidity_ratio: 0.15, factor: 0.20}
  otherwise_factor: 0.00      # BLOCK

# P3 - basis drift. Bands become empirical percentiles (WATCH p75,
# DEGRADED p95, BROKEN p99) once the distribution by market state exists.
basis:
  bands:
    NOMINAL:  {max_abs_bps: 100,  factor: 1.00}
    WATCH:    {max_abs_bps: 250,  factor: 0.75}
    DEGRADED: {max_abs_bps: 500,  factor: 0.35}
    BROKEN:   {max_abs_bps: null, factor: 0.00}   # requires explicit confirm
  degraded_floor_reference_age_s: 172800          # 48h
  max_reference_age_s: 432000                     # 120h -> BLOCK (Law 3)

# P4 - corporate actions.
corporate_actions:
  lookahead_hours: 24
  # An allowlist, not a blocklist. Binance publishes statuses this project has
  # not enumerated, and an unrecognised status must never fall through to a
  # pass. Only an explicitly tradable pair trades.
  tradable_statuses: [TRADING]

# P6 - canonical contract. Registry is compiled in and checksummed at load;
# a mismatch is a BLOCK with no override path.
registry_sha256: b4ee770b92b077e1ff77d6dbf527400f435cd10eca27dbe936ab4b56b6746f1b

# Law 7 - the guard's entire action space. It may never originate an order or
# increase a size.
verdicts: [PASS, WARN, REDUCE, BLOCK]

# ---------------------------------------------------------------------------
# Execution.
#
# The guard decides; this decides whether anything is allowed to act on that
# decision, and how much. Every value here is a CEILING applied on top of the
# guard's answer, never a floor and never a permission to exceed it.
#
# `enabled: false` is the shipped default. Turning it on is a deliberate,
# reviewable edit to a checksummed file, which is the only way to change it -
# there is no flag, no environment variable and no request field that switches
# it on at runtime.
# ---------------------------------------------------------------------------
executor:
  enabled: false

  # A hard cap in USDT, independent of the guard. If the guard permits 300 and
  # this says 25, the order is 25. It exists so that a mistake anywhere in the
  # sizing chain is bounded by a number a human chose by hand.
  max_order_usdt: 25.0

  # An allowlist. A symbol absent from this list cannot be traded even if every
  # protection passes.
  symbols: [NVDABUSDT]

  # Orders are placed only while a human is watching. There is no scheduler and
  # no daemon: something must invoke the executor for each order.
  require_manual_invocation: true
