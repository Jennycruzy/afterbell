[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterbell"
version = "0.1.0"
description = "A deterministic, calendar-aware risk boundary for tokenized equities"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "alpaca-py>=0.30",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["afterbell*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: read-only calls to live public market-data endpoints",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["afterbell"]

[tool.coverage.report]
fail_under = 70
show_missing = true
