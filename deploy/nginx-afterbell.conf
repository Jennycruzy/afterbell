# AFTERBELL dashboard, proxied to the loopback service on 8100.
#
# This is a standalone server block. It does not read, modify or depend on any
# other site on this host.
#
# Install:
#   sudo cp deploy/nginx-afterbell.conf /etc/nginx/sites-available/afterbell
#   sudo ln -s /etc/nginx/sites-available/afterbell /etc/nginx/sites-enabled/afterbell
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <your-domain>
#
# The A record must already point at this host before certbot runs, or the
# HTTP-01 challenge fails. deploy/publish.sh checks that first.

# The application has a second, persisted quota. This source-address limiter
# is the first line at the public boundary, before a request reaches Python.
# Keep the zone in http context (the server block below is included from
# nginx.conf's http block).
limit_req_zone $binary_remote_addr zone=afterbell_mcp:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name AFTERBELL_DOMAIN www.AFTERBELL_DOMAIN;

    # The MCP surface. Read-only, unauthenticated, and deliberately so: the
    # server holds no credential, so there is nothing here to protect with one.
    location /mcp {
        limit_req zone=afterbell_mcp burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }
}
